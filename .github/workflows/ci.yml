name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests evals && ruff format --check src tests evals
      - run: pytest -q
      - name: Routing evals (offline, gated)
        run: python evals/run_evals.py

  postgres-checkpoint:
    # Optional backend: runs the durable pause/resume test against a real Postgres service.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage
          POSTGRES_DB: triage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TRIAGE_TEST_POSTGRES_URL: postgresql://triage:triage@localhost:5432/triage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_checkpoint.py -k postgres -rs

  docker:
    # Builds the API image and smoke-tests it: non-root user, health, auth, one triage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t triage-graph:ci .
      - name: Smoke test
        run: |
          TOKEN=$(openssl rand -hex 24)
          docker run -d --name tg -p 8000:8000 -e TRIAGE_API_TOKEN=$TOKEN triage-graph:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          test "$(docker exec tg id -u)" = "10001"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/approvals)" = "401"
          curl -fs -X POST localhost:8000/triage -H "Authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' \
            -d '{"ticket_id":"ci-1","text":"Cobrado em dobro R$ 120,00, reembolso"}' \
            | grep -q pending_approval
          curl -fs localhost:8000/approvals -H "Authorization: Bearer $TOKEN" | grep -q ci-1
      - if: always()
        run: docker logs tg || true
