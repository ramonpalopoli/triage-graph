[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-graph"
version = "0.1.0"
description = "Multi-step LangGraph agent that triages support tickets with retrieval, policy checks and human-in-the-loop approval before any write."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ramon Palopoli" }]
keywords = ["langgraph", "ai-agent", "human-in-the-loop", "llm", "rag", "anthropic", "evals"]
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
sqlite = ["langgraph-checkpoint-sqlite>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.4", "langgraph-checkpoint-sqlite>=2.0"]

[project.scripts]
triage-graph = "triage_graph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
